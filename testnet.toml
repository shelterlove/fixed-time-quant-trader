# This file is intentionally separate from strategy.toml.  It documents the
# live/testnet execution profile without mutating the frozen research strategy.
[environment]
market_data_base_url = "https://fapi.binance.com"
trading_base_url = "https://demo-fapi.binance.com"
trading_environment = "testnet"

[account]
position_mode = "hedge"
margin_type = "isolated"
leverage = 1
single_asset_mode = true

[long_extension]
# Live-only, research-selected exit variant.  strategy.toml remains frozen.
enabled = true
activation_lookback_hours = 4
maximum_extension_hours = 24
evict_after_hours = 4

[runtime]
account_poll_seconds = 5
idle_reconcile_seconds = 60
decision_deadline_seconds = 60
request_timeout_seconds = 10
max_attempts = 3
max_concurrent_market_requests = 8
