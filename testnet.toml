[environment]
market_data_base_url = "https://fapi.binance.com"
trading_base_url = "https://demo-fapi.binance.com"
trading_environment = "testnet"

[account]
position_mode = "hedge"
margin_type = "isolated"
leverage = 2
single_asset_mode = true

[runtime]
account_poll_seconds = 5
reconcile_seconds = 5
decision_delay_seconds = 60
decision_deadline_seconds = 180
request_timeout_seconds = 10
max_attempts = 3
max_market_workers = 8
